name: rename-icon

on:
  push:
    paths:
      - '.github/workflows/rename-icon.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
      - name: rename uuid icon to 192.png
        run: |
          set -e
          ls -l docs/icons
          git mv "docs/icons/71F7327E-1C80-444B-8185-F26C77B7AB1F.png" "docs/icons/192.png"
          git rm .github/workflows/rename-icon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(icons): 重命名为 192.png"
          git push origin HEAD:release
