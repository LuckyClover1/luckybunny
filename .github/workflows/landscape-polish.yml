name: landscape-polish
on:
  push:
    paths:
      - .github/workflows/landscape-polish.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
      - name: Patch landscape CSS
        run: |
          python3 - <<'PY'
          import sys
          HEAD_OLD = '''            .topbar {
                padding: 0 0 6px;
            }

            .titles h1 {
                font-size: 13.5px;
            }
'''
          HEAD_NEW = '''            .topbar {
                padding: 0 0 4px;
                gap: 8px;
            }

            .back {
                width: 26px;
                height: 26px;
                border-radius: 9px;
            }

            .back svg {
                width: 14px;
                height: 14px;
            }

            .titles h1 {
                font-size: 12.5px;
                line-height: 1.25;
            }

            .titles p {
                font-size: 10.5px;
                line-height: 1.25;
            }

            .now-badge {
                font-size: 10px;
                padding: 2px 7px;
            }
'''
          HEAD_NEW_BILI = '''            .topbar {
                padding: 0 0 4px;
                gap: 8px;
            }

            .back {
                width: 26px;
                height: 26px;
                border-radius: 9px;
            }

            .back svg {
                width: 14px;
                height: 14px;
            }

            .titles h1 {
                font-size: 12.5px;
                line-height: 1.25;
            }

            .src-badge {
                font-size: 10px;
                padding: 2px 7px;
            }
'''
          TAIL_OLD = '''            .list-head {
                padding: 0 2px 8px;
            }

            .row {
                padding: 6px;
            }

            .row .thumb {
                width: 84px;
            }

            .row .name {
                font-size: 13.5px;
            }
'''
          def tail(auto):
              extra = '''            .auto-btn {
                font-size: 10.5px;
                padding: 2px 7px;
            }

''' if auto else ''
              return '''            .list-head {
                padding: 0 2px 6px;
                gap: 6px;
            }

            .list-head .dot {
                width: 3px;
                height: 12px;
            }

            .list-head h2 {
                font-size: 12.5px;
            }

            .list-head .count {
                font-size: 10.5px;
                padding: 1px 7px;
            }

''' + extra + '''            .list {
                gap: 5px;
            }

            .row {
                padding: 5px 8px;
                border-radius: 10px;
                gap: 0;
            }

            .row .thumb {
                display: none;
            }

            .row .info {
                display: flex;
                align-items: baseline;
                gap: 6px;
            }

            .row .idx {
                flex: none;
                font-size: 10px;
                letter-spacing: .03em;
            }

            .row .eq {
                height: 9px;
                margin-left: 2px;
            }

            .row .name {
                flex: 1;
                min-width: 0;
                margin-top: 0;
                font-size: 12px;
                line-height: 1.3;
                -webkit-line-clamp: 1;
            }
'''
          STICKY_FLEX = ('                flex: 1 1 62%;', '                flex: 1 1 auto;\n                min-width: 0;')
          STICKY_PAD = ('                padding: 8px calc(8px + var(--safe-r)) 8px calc(10px + var(--safe-l));',
                        '                padding: 6px calc(6px + var(--safe-r)) 6px calc(8px + var(--safe-l));')
          CATE_PLAYER = ('''            .player {
                width: 100%;
                max-width: calc((100vh - 96px) * 16 / 9);
                margin: 0 auto;
                border-radius: 12px;
''', '''            .player {
                width: min(100%, calc((100vh - 50px) * 16 / 9));
                margin: 0 auto;
                border-radius: 8px;
''')
          BILI_PLAYER = ('''            .player {
                width: 100%;
                max-width: calc((100vh - 136px) * 16 / 9);
                margin: 0 auto;
                border-radius: 12px;
                flex: none;
''', '''            .player {
                width: min(100%, calc((100vh - 50px) * 16 / 9));
                margin: 0 auto;
                border-radius: 8px;
                flex: none;
''')
          BILI_HINT = ('''            .player-hint {
                flex: none;
                width: 100%;
                max-width: calc((100vh - 136px) * 16 / 9);
                padding: 5px 2px 0;
                font-size: 11px;
                justify-content: center;
            }
''', '''            .player-hint {
                display: none;
            }
''')
          WRAP_FLEX = ('                flex: 0 0 38%;\n                height: 100%;',
                       '                flex: 0 0 27%;\n                min-width: 182px;\n                max-width: 264px;\n                height: 100%;')
          WRAP_PAD = ('                padding: 8px calc(10px + var(--safe-r)) 14px calc(8px + var(--safe-l));',
                      '                padding: 6px calc(8px + var(--safe-r)) 12px calc(6px + var(--safe-l));')
          REPS_CATE = [(STICKY_FLEX), (STICKY_PAD), (HEAD_OLD, HEAD_NEW), CATE_PLAYER, WRAP_FLEX, WRAP_PAD, (TAIL_OLD, tail(True))]
          REPS_BILI = [(STICKY_FLEX), (STICKY_PAD), (HEAD_OLD, HEAD_NEW_BILI), BILI_PLAYER, BILI_HINT, WRAP_FLEX, WRAP_PAD, (TAIL_OLD, tail(False))]
          def apply(path, reps):
              s = open(path, encoding='utf-8').read()
              for old, new in reps:
                  n = s.count(old)
                  if n != 1:
                      sys.exit('[%s] anchor count %d: %r' % (path, n, old[:40]))
                  s = s.replace(old, new, 1)
              open(path, 'w', encoding='utf-8').write(s)
              print('patched', path, len(s))
          apply('docs/cate.html', REPS_CATE)
          apply('docs/cate_bilibili.html', REPS_BILI)
          PY
      - name: Commit and push
        run: |
          git config user.name "LuckyClover1"
          git config user.email "2418569961@qq.com"
          git add docs/cate.html docs/cate_bilibili.html
          git rm -q .github/workflows/landscape-polish.yml
          git commit -m "feat(ui): 横屏播放器最大化 + 右侧纯文字选集"
          git push origin HEAD:release
