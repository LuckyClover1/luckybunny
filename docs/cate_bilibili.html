<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fbf7f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141110" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" type="image/png" href="icons/48.png">
    <link rel="manifest" href="manifest.json">
    <title>故事 · LuckyBunny</title>
    <style>
        :root {
            --bg: #fbf7f2;
            --bg-soft: #f3ece4;
            --card: #ffffff;
            --ink: #241d18;
            --sub: #8b7f76;
            --line: #efe6dc;
            --brand: #ff7a3d;
            --brand-2: #ffb45c;
            --shadow-sm: 0 2px 10px rgba(120, 80, 40, .07);
            --safe-t: env(safe-area-inset-top, 0px);
            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-l: env(safe-area-inset-left, 0px);
            --safe-r: env(safe-area-inset-right, 0px);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #141110;
                --bg-soft: #201b17;
                --card: #1f1a16;
                --ink: #f4ede4;
                --sub: #a2948a;
                --line: #2e2620;
                --brand: #ff8b52;
                --brand-2: #ffc078;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            overflow-x: hidden;
            padding-left: var(--safe-l);
            padding-right: var(--safe-r);
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .sticky {
            position: sticky;
            top: 0;
            z-index: 20;
            padding-top: var(--safe-t);
            background: var(--bg);
            border-bottom: 1px solid transparent;
            transition: border-color .2s, box-shadow .2s;
        }

        .sticky.scrolled {
            border-bottom-color: var(--line);
            box-shadow: 0 6px 18px rgba(90, 60, 30, .06);
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
        }

        .back {
            width: 36px;
            height: 36px;
            flex: none;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            background: var(--card);
            border-radius: 12px;
            color: var(--ink);
            transition: transform .16s;
        }

        .back:active {
            transform: scale(.92);
        }

        .back svg {
            width: 17px;
            height: 17px;
        }

        .titles {
            flex: 1;
            min-width: 0;
        }

        .titles h1 {
            font-size: 15.5px;
            font-weight: 800;
            letter-spacing: -.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .titles p {
            font-size: 11.5px;
            color: var(--sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .src-badge {
            flex: none;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            padding: 4px 9px;
            border-radius: 999px;
            background: #fb7299;
        }

        .player-box {
            padding: 2px 14px 10px;
            max-width: 640px;
            margin: 0 auto;
        }

        .player {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0b0908;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(40, 25, 10, .16);
        }

        .player iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #0b0908;
        }

        .player-hint {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 4px 2px;
            font-size: 11.5px;
            color: var(--sub);
        }

        .player-hint a {
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        /* ============ 列表 ============ */
        .wrap {
            padding: 0 14px calc(26px + var(--safe-b));
            max-width: 640px;
            margin: 0 auto;
        }

        .list-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 2px 10px;
        }

        .list-head .dot {
            width: 4px;
            height: 15px;
            border-radius: 3px;
            background: linear-gradient(180deg, var(--brand), var(--brand-2));
        }

        .list-head h2 {
            font-size: 15px;
            font-weight: 800;
        }

        .list-head .count {
            margin-left: auto;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--sub);
            background: var(--bg-soft);
            border-radius: 999px;
            padding: 2px 9px;
        }

        .list {
            display: grid;
            gap: 9px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 11px;
            width: 100%;
            padding: 8px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            text-align: left;
            font: inherit;
            color: inherit;
            transition: transform .16s cubic-bezier(.2, .8, .3, 1), border-color .2s, background .2s;
            animation: rise .4s cubic-bezier(.2, .8, .3, 1) both;
        }

        .row:active {
            transform: scale(.975);
        }

        .row.active {
            border-color: rgba(255, 122, 61, .55);
            background: linear-gradient(180deg, rgba(255, 180, 92, .10), rgba(255, 122, 61, .06));
        }

        .row .thumb {
            position: relative;
            width: 104px;
            aspect-ratio: 16 / 9;
            flex: none;
            border-radius: 11px;
            overflow: hidden;
            background: linear-gradient(135deg, #ffb27a, #ef7440);
            display: grid;
            place-items: center;
            font-size: 20px;
        }

        .row .thumb .epno {
            position: relative;
            z-index: 1;
            font-size: 19px;
            font-weight: 800;
            color: #fff;
            letter-spacing: .02em;
            text-shadow: 0 1px 4px rgba(150, 70, 20, .35);
        }

        .row .thumb img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .row .play-mask {
            position: absolute;
            right: 4px;
            bottom: 4px;
            width: 18px;
            height: 18px;
            display: grid;
            place-items: center;
            background: transparent;
        }

        .row.active .play-mask {
            display: none;
        }

        .row .play-mask svg {
            width: 13px;
            height: 13px;
            color: #fff;
            opacity: .95;
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .45));
        }

        .row .info {
            flex: 1;
            min-width: 0;
        }

        .row .idx {
            font-size: 11px;
            font-weight: 700;
            color: var(--sub);
            letter-spacing: .06em;
        }

        .row .name {
            margin-top: 2px;
            font-size: 14.5px;
            font-weight: 700;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .row.active .name {
            color: var(--brand);
        }

        .eq {
            display: none;
            align-items: flex-end;
            gap: 2px;
            height: 11px;
            margin-left: 6px;
            vertical-align: -2px;
        }

        .row.active .eq {
            display: inline-flex;
        }

        .eq i {
            display: block;
            width: 2.5px;
            background: var(--brand);
            border-radius: 2px;
            animation: eq .9s infinite ease-in-out;
        }

        .eq i:nth-child(1) {
            height: 55%;
            animation-delay: -.9s;
        }

        .eq i:nth-child(2) {
            height: 100%;
            animation-delay: -.45s;
        }

        .eq i:nth-child(3) {
            height: 70%;
            animation-delay: -.2s;
        }

        @keyframes eq {

            0%,
            100% {
                transform: scaleY(.55);
            }

            50% {
                transform: scaleY(1);
            }
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sk {
            padding: 4px 0 6px;
        }

        .sk-row {
            height: 74px;
            border-radius: 16px;
            margin-bottom: 9px;
            background: linear-gradient(90deg, var(--bg-soft) 25%, #fff 50%, var(--bg-soft) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite linear;
        }

        @media (prefers-color-scheme: dark) {
            .sk-row {
                background: linear-gradient(90deg, #221c18 25%, #2c2521 50%, #221c18 70%);
                background-size: 200% 100%;
            }
        }

        @keyframes shimmer {
            from {
                background-position: 200% 0;
            }

            to {
                background-position: -200% 0;
            }
        }

        .state {
            display: none;
            padding: 54px 24px;
            text-align: center;
            color: var(--sub);
            font-size: 13.5px;
        }

        .state .emoji {
            font-size: 34px;
            display: block;
            margin-bottom: 10px;
        }

        /* ============ 横屏：左播放器 + 右选集 ============ */
        @media (orientation: landscape) and (max-height: 520px) {

            html,
            body {
                height: 100%;
                overflow: hidden;
            }

            body {
                display: flex;
                align-items: stretch;
            }

            .sticky {
                position: relative;
                top: auto;
                flex: 1 1 62%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                height: 100%;
                padding: 8px calc(8px + var(--safe-r)) 8px calc(10px + var(--safe-l));
                border-bottom: none;
                box-shadow: none;
            }

            .sticky.scrolled {
                border-bottom-color: transparent;
                box-shadow: none;
            }

            .topbar {
                padding: 0 0 6px;
            }

            .titles h1 {
                font-size: 13.5px;
            }

            .player-box {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 0;
                margin: 0;
                max-width: none;
            }

            .player {
                width: 100%;
                max-width: calc((100vh - 136px) * 16 / 9);
                margin: 0 auto;
                border-radius: 12px;
                flex: none;
            }

            .player-hint {
                flex: none;
                width: 100%;
                max-width: calc((100vh - 136px) * 16 / 9);
                padding: 5px 2px 0;
                font-size: 11px;
                justify-content: center;
            }

            .wrap {
                flex: 0 0 38%;
                height: 100%;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                padding: 8px calc(10px + var(--safe-r)) 14px calc(8px + var(--safe-l));
                max-width: none;
                border-left: 1px solid var(--line);
            }

            .list-head {
                padding: 0 2px 8px;
            }

            .row {
                padding: 6px;
            }

            .row .thumb {
                width: 84px;
            }

            .row .name {
                font-size: 13.5px;
            }
        }
    </style>
</head>

<body>
    <div class="sticky" id="sticky">
        <div class="topbar">
            <a class="back" href="index.html" aria-label="返回列表">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
            </a>
            <div class="titles">
                <h1 id="pageTitle">故事专辑</h1>
                <p id="pageSub">加载中…</p>
            </div>
            <span class="src-badge">B站</span>
        </div>

        <div class="player-box">
            <div class="player">
                <iframe id="mainVideo" title="故事播放器" src="about:blank" scrolling="no" frameborder="0"
                    framespacing="0" allow="autoplay; fullscreen; picture-in-picture"
                    allowfullscreen="true"
                    sandbox="allow-top-navigation allow-same-origin allow-forms allow-scripts allow-popups"></iframe>
            </div>
            <div class="player-hint">
                <span>播放卡顿？</span>
                <a id="openInBili" href="#" target="_blank" rel="noopener">在 B 站打开本集</a>
            </div>
        </div>
    </div>

    <main class="wrap">
        <div class="list-head">
            <span class="dot"></span>
            <h2>全部故事</h2>
            <span class="count" id="listCount">…</span>
        </div>
        <div class="list" id="mediaList">
            <div class="sk" id="skeleton">
                <div class="sk-row"></div>
                <div class="sk-row"></div>
                <div class="sk-row"></div>
                <div class="sk-row"></div>
            </div>
        </div>
        <div class="state" id="state">
            <span class="emoji">🌙</span>
            <span id="stateText">这个专辑的故事还没上线</span>
        </div>
    </main>

    <script type="text/javascript" src="js/httpclient.js"></script>
    <script>
        (function () {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('js/sw.js').catch(function () { });
            }
        })();

        (function () {
            var cateId = new URLSearchParams(window.location.search).get('id') || '';
            var mediaList = document.getElementById('mediaList');
            var skeleton = document.getElementById('skeleton');
            var state = document.getElementById('state');
            var stateText = document.getElementById('stateText');
            var pageTitle = document.getElementById('pageTitle');
            var pageSub = document.getElementById('pageSub');
            var listCount = document.getElementById('listCount');
            var frame = document.getElementById('mainVideo');
            var openInBili = document.getElementById('openInBili');
            var sticky = document.getElementById('sticky');

            var items = [];

            function esc(str) {
                return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            window.addEventListener('scroll', function () {
                sticky.classList.toggle('scrolled', window.scrollY > 4);
            }, { passive: true });

            function play(index, autoplay) {
                if (index < 0 || index >= items.length) return;
                var item = items[index];
                var url = item.videoUrl || '';
                if (autoplay && url.indexOf('autoplay') === -1) {
                    url += (url.indexOf('?') > -1 ? '&' : '?') + 'autoplay=1&danmaku=0';
                }
                frame.src = url;

                openInBili.href = url.replace('//player.bilibili.com/player.html', 'https://www.bilibili.com/video');

                pageSub.textContent = '正在播放 · 第 ' + (index + 1) + ' / ' + items.length + ' 集';
                document.title = (item.name || '故事') + ' · LuckyBunny';

                mediaList.querySelectorAll('.row').forEach(function (row, i) {
                    row.classList.toggle('active', i === index);
                });
            }

            function render(data) {
                items = data;
                var frag = document.createDocumentFragment();
                var lastIcon = null;

                data.forEach(function (item, i) {
                    var row = document.createElement('button');
                    row.className = 'row';
                    row.type = 'button';
                    row.style.animationDelay = Math.min(i * 40, 340) + 'ms';
                    row.setAttribute('aria-label', item.name);

                    var thumb = document.createElement('div');
                    thumb.className = 'thumb';

                    // B 站专辑的 icon 大多是同一个头像，重复出现就没必要加载了
                    var pad = String(i + 1).padStart(2, '0');
                    var no = document.createElement('span');
                    no.className = 'epno';
                    no.textContent = pad;
                    thumb.appendChild(no);

                    if (item.icon && item.icon !== lastIcon) {
                        var img = document.createElement('img');
                        img.src = item.icon;
                        img.alt = item.name || '';
                        img.loading = i < 3 ? 'eager' : 'lazy';
                        img.decoding = 'async';
                        img.onerror = function () { img.remove(); };
                        thumb.appendChild(img);
                        lastIcon = item.icon;
                    }
                    var mask = document.createElement('span');
                    mask.className = 'play-mask';
                    mask.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.55.84l9.6-6.5a1 1 0 0 0 0-1.68l-9.6-6.5A1 1 0 0 0 8 5.5z"/></svg>';
                    thumb.appendChild(mask);

                    var info = document.createElement('div');
                    info.className = 'info';
                    info.innerHTML =
                        '<div class="idx"><span>EP ' + (i + 1) + '</span>' +
                        '<span class="eq"><i></i><i></i><i></i></span></div>' +
                        '<div class="name">' + esc(item.name) + '</div>';

                    row.appendChild(thumb);
                    row.appendChild(info);
                    row.addEventListener('click', function () { play(i, true); });
                    frag.appendChild(row);
                });

                skeleton.style.display = 'none';
                mediaList.appendChild(frag);
                listCount.textContent = data.length + ' 集';

                play(0, false);
            }

            function showState(text) {
                if (skeleton) skeleton.style.display = 'none';
                state.style.display = 'block';
                stateText.textContent = text;
                listCount.textContent = '0 集';
                pageSub.textContent = '暂无内容';
            }

            if (typeof makeRequest !== 'function') {
                showState('加载脚本失败，请刷新页面重试');
                return;
            }

            makeRequest('GET', 'json/cate.json', null, function (err, data) {
                if (err || !data) return;
                Object.keys(data).forEach(function (name) {
                    (data[name] || []).forEach(function (c) {
                        if (String(c.id) === String(cateId)) pageTitle.textContent = name;
                    });
                });
            });

            var done = false;
            makeRequest('GET', 'json/media-' + encodeURIComponent(cateId) + '.json', null, function (err, data) {
                if (done) return;
                done = true;
                if (err || !data || !data.length) return showState('这个专辑的故事还没上线');
                render(data);
            });

            setTimeout(function () {
                if (!done) showState('加载有点慢，请检查网络后刷新');
            }, 8000);
        })();
    </script>
</body>

</html>
